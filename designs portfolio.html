<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apoorwa | Dark Design Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ========================= GLOBAL ========================= */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:#050505;color:white;font-family:'Poppins',sans-serif;overflow-x:hidden;}

/* Background */
.bg{
position:fixed;width:100%;height:100%;z-index:-10;
background:
radial-gradient(circle at top left, rgba(140,82,255,0.18), transparent 30%),
radial-gradient(circle at bottom right, rgba(255,0,98,0.15), transparent 30%),
linear-gradient(to bottom,#050505,#0a0a0f,#101015);
}

/* NAV */
nav{
position:fixed;top:0;width:100%;
padding:18px 8%;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,255,255,0.05);
z-index:1000;
}
.logo{font-family:'Orbitron';font-size:28px;letter-spacing:3px;}
.nav-right{display:flex;gap:25px;}
.nav-right a{text-decoration:none;color:#d0d0d0;}
.nav-right a:hover{color:white;}

/* HERO */
.hero{min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:120px 8%;}
.hero h1{font-size:70px;font-family:'Orbitron';background:linear-gradient(to right,#fff,#8c52ff,#ff0066);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:#bdbdbd;line-height:1.8;max-width:700px;margin:auto;}

/* BUTTONS */
.btn{padding:14px 34px;border-radius:14px;text-decoration:none;cursor:pointer;}
.btn-primary{background:linear-gradient(to right,#8c52ff,#ff0066);color:white;}
.btn-secondary{background:rgba(255,255,255,0.05);color:white;border:1px solid rgba(255,255,255,0.08);}

/* GALLERY */
.poster-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.poster{
background:#111;border-radius:20px;overflow:hidden;
border:1px solid rgba(255,255,255,0.06);
}

.poster img{
width:100%;height:320px;object-fit:cover;
cursor:pointer;
}

/* OVERLAY */
.poster-overlay{padding:15px;background:rgba(0,0,0,0.6);}
.poster-category{font-size:12px;color:#b58cff;}
.poster-description{font-size:12px;color:#ccc;}

/* UPLOAD */
.upload-zone{
margin-top:40px;
border:2px dashed rgba(255,255,255,0.2);
padding:40px;
text-align:center;
display:none;
}
.upload-zone.upload-visible{display:block;}

/* LIGHTBOX */
.lightbox{
position:fixed;inset:0;
display:none;
justify-content:center;align-items:center;
background:rgba(0,0,0,0.95);
z-index:9999;
}
.lightbox img{max-width:90%;max-height:90%;}

/* ADMIN */
#adminPanel,#editPanel{
position:fixed;inset:0;
display:none;
justify-content:center;align-items:center;
background:rgba(0,0,0,0.85);
z-index:99999;
}
.admin-box{background:#111;padding:25px;border-radius:15px;width:320px;}
</style>
</head>

<body>

<div class="bg"></div>

<nav>
<div class="logo">APOORWA</div>
<div class="nav-right">
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
</div>
</nav>

<section class="hero">
<div>
<h1>DARK DESIGN PORTFOLIO</h1>
<p>Collection of cinematic posters and branding work.</p>
<br>
<a class="btn btn-primary" href="#gallery">Explore</a>
</div>
</section>

<section id="gallery">
<h2 style="text-align:center;margin:40px 0;">Gallery</h2>

<div class="poster-grid" id="posterGrid"></div>

<div class="upload-zone" id="uploadZone">
<h3>Upload Designs</h3>
<input type="file" id="fileInput" multiple accept="image/*">
<button onclick="saveDB()">Save</button>
</div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<!-- ADMIN -->
<div id="adminPanel">
<div class="admin-box">
<h3>Login</h3>
<input type="password" id="password">
<button onclick="loginAdmin()">Login</button>
</div>
</div>

<script>

/* ================= DATA ================= */

let db = [];

const DEFAULT_DESIGNS = [
{img:"creations/1.png",title:"Design 1",category:"poster",description:"Cinematic artwork"},
{img:"creations/2.jpg",title:"Design 2",category:"poster",description:"Cinematic artwork"},
{img:"creations/3.jpg",title:"Design 3",category:"poster",description:"Cinematic artwork"},
{img:"creations/anime-birthday-image.png",title:"Anime Birthday",category:"event",description:"Event design"},
{img:"creations/beyond-destiny.png",title:"Beyond Destiny",category:"poster",description:"Dark concept"},
{img:"creations/dp-1.png",title:"Brand 1",category:"brand",description:"Identity design"}
];

/* ================= RENDER ================= */

function render(){
const grid=document.getElementById("posterGrid");
grid.innerHTML="";

db.forEach((item,i)=>{
const div=document.createElement("div");
div.className="poster";
div.innerHTML=`
<img src="${item.img}" onclick="openLightbox(${i})">
<div class="poster-overlay">
<h4>${item.title}</h4>
<div class="poster-category">${item.category}</div>
<p class="poster-description">${item.description}</p>
</div>
`;
grid.appendChild(div);
});
}

/* ================= LIGHTBOX ================= */

let currentIndex=0;

function openLightbox(i){
currentIndex=i;
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightboxImg").src=db[i].img;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

/* ================= ADMIN ================= */

let admin=false;
const PASSWORD="1234";

function loginAdmin(){
if(document.getElementById("password").value===PASSWORD){
admin=true;
document.getElementById("uploadZone").classList.add("upload-visible");
document.getElementById("adminPanel").style.display="none";
}else{
alert("Wrong password");
}
}

/* ================= UPLOAD ================= */

document.getElementById("fileInput").addEventListener("change",async e=>{
for(const file of e.target.files){
const reader=new FileReader();
reader.onload=function(ev){
db.push({
img:ev.target.result,
title:file.name,
category:"poster",
description:"Uploaded design"
});
render();
};
reader.readAsDataURL(file);
}
});

/* ================= INIT ================= */

db=[...DEFAULT_DESIGNS];
render();

</script>

</body>
</html>
